<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 565" width="1200" height="565">
  <defs>
    <style type="text/css"><![CDATA[
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap");
      .font-sans { font-family: "Inter", system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: "JetBrains Mono", monospace; }
    ]]></style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0530"/>
      <stop offset="50%" stop-color="#090025"/>
      <stop offset="100%" stop-color="#06001B"/>
    </linearGradient>

    <!-- Stage Gradients -->
    <linearGradient id="stage1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160D42"/>
      <stop offset="100%" stop-color="#0E062C"/>
    </linearGradient>
    <linearGradient id="stage2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1C47"/>
      <stop offset="100%" stop-color="#061230"/>
    </linearGradient>
    <linearGradient id="stage3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#280D33"/>
      <stop offset="100%" stop-color="#180720"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062E23"/>
      <stop offset="100%" stop-color="#031A14"/>
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="indigoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowIndigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#818CF8"/>
    </marker>
    <marker id="arrowSky" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- Canvas Background (Exact #090025 palette) -->
  <rect width="1200" height="565" rx="20" fill="url(#bgGrad)" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.12" stroke="#818CF8" stroke-width="0.5">
    <line x1="30" y1="90" x2="1170" y2="90"/>
    <line x1="30" y1="465" x2="1170" y2="465"/>
  </g>

  <!-- Ambient background glow spots -->
  <circle cx="200" cy="120" r="140" fill="#6366F1" opacity="0.08" filter="blur(60px)"/>
  <circle cx="600" cy="140" r="160" fill="#0284C7" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="140" r="140" fill="#E11D48" opacity="0.08" filter="blur(60px)"/>

  <!-- Header -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="220" height="22" rx="11" fill="#4338CA" fill-opacity="0.35" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1"/>
    <text x="110" y="15" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="700" fill="#A5B4FC" letter-spacing="1.5">HOMELAB REBUILD PIPELINE</text>
    <text x="0" y="44" class="font-sans" font-size="20" font-weight="700" fill="#FFFFFF">Repurposing i7 Chromebox into Proxmox VE 9.2 Server</text>
    <text x="560" y="44" class="font-mono" font-size="12" fill="#94A3B8">Core i7 (4C/8T) • 16GB RAM • 500GB NVMe • Debian 13 Trixie</text>
  </g>

  <!-- ================= STAGE 1: FLASH UEFI ================= -->
  <g transform="translate(40, 105)">
    <!-- Outer Card -->
    <rect width="345" height="348" rx="16" fill="url(#stage1Grad)" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Stage Badge -->
    <rect x="20" y="18" width="68" height="22" rx="11" fill="#4338CA" fill-opacity="0.6"/>
    <text x="54" y="33" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#C7D2FE">STAGE 1</text>
    <text x="98" y="34" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">Flash UEFI Full ROM</text>

    <!-- Step 1.1 -->
    <g transform="translate(18, 55)">
      <rect width="309" height="74" rx="10" fill="#1B104C" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="22" cy="24" r="10" fill="#4338CA" fill-opacity="0.8"/>
      <text x="22" y="28" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
      <text x="40" y="25" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF">Boot Live Linux USB</text>
      <text x="40" y="44" class="font-sans" font-size="11" fill="#94A3B8">Tap </text>
      <text x="63" y="44" class="font-mono" font-size="11" font-weight="700" fill="#C7D2FE">ESC / F2</text>
      <text x="120" y="44" class="font-sans" font-size="11" fill="#94A3B8"> at power-on → Select USB</text>
      <text x="40" y="60" class="font-sans" font-size="11" fill="#818CF8">"Try Ubuntu without installing"</text>
    </g>

    <!-- Step 1.2 -->
    <g transform="translate(18, 137)">
      <rect width="309" height="88" rx="10" fill="#1B104C" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="22" cy="22" r="10" fill="#4338CA" fill-opacity="0.8"/>
      <text x="22" y="26" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
      <text x="40" y="24" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF">Run MrChromebox Firmware Script</text>
      <rect x="40" y="34" width="255" height="24" rx="6" fill="#0C0624"/>
      <text x="48" y="50" class="font-mono" font-size="10" fill="#38BDF8">curl -LOf mrchromebox.tech/firmware-util.sh</text>
      <text x="40" y="74" class="font-sans" font-size="11" fill="#A5B4FC">Select Option 2: </text>
      <text x="130" y="74" class="font-mono" font-size="11" font-weight="600" fill="#FFFFFF">Install Full ROM UEFI</text>
    </g>

    <!-- Step 1.3 -->
    <g transform="translate(18, 233)">
      <rect width="309" height="100" rx="10" fill="#201042" stroke="#F43F5E" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="22" cy="22" r="10" fill="#9F1239" fill-opacity="0.8"/>
      <text x="22" y="26" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
      <text x="40" y="24" class="font-sans" font-size="13" font-weight="700" fill="#FDA4AF">Restore Hardware LAN MAC (CRITICAL)</text>
      <text x="40" y="44" class="font-mono" font-size="10.5" fill="#E2E8F0">Node A: </text>
      <text x="95" y="44" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8">B4:A9:FC:21:B9:77</text>
      <text x="40" y="62" class="font-mono" font-size="10.5" fill="#E2E8F0">Node B: </text>
      <text x="95" y="62" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8">D8:C4:97:AD:0F:A4</text>
      <text x="40" y="84" class="font-sans" font-size="11" font-weight="600" fill="#F43F5E">Choose Power Off in script (Do not reboot)</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(393, 275)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowIndigo)"/>
    <text x="13" y="-8" text-anchor="middle" class="font-mono" font-size="9" font-weight="600" fill="#A5B4FC">Flash OK</text>
  </g>

  <!-- ================= STAGE 2: INSTALL PVE 9.2 ================= -->
  <g transform="translate(427, 105)">
    <!-- Outer Card -->
    <rect width="345" height="348" rx="16" fill="url(#stage2Grad)" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Stage Badge -->
    <rect x="20" y="18" width="68" height="22" rx="11" fill="#0369A1" fill-opacity="0.6"/>
    <text x="54" y="33" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#BAE6FD">STAGE 2</text>
    <text x="98" y="34" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">Install Proxmox VE 9.2</text>

    <!-- Step 2.1 -->
    <g transform="translate(18, 55)">
      <rect width="309" height="74" rx="10" fill="#0C2556" stroke="#0284C7" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="22" cy="24" r="10" fill="#0284C7" fill-opacity="0.8"/>
      <text x="22" y="28" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
      <text x="40" y="25" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF">Boot PVE 9.2 Installer USB</text>
      <text x="40" y="44" class="font-sans" font-size="11" fill="#BAE6FD">Official ISO on Ventoy / Rufus (DD Mode)</text>
      <text x="40" y="60" class="font-sans" font-size="11" fill="#38BDF8">Debian 13 Trixie + Linux Kernel 7.0</text>
    </g>

    <!-- Step 2.2 -->
    <g transform="translate(18, 137)">
      <rect width="309" height="88" rx="10" fill="#0C2556" stroke="#0284C7" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="22" cy="22" r="10" fill="#0284C7" fill-opacity="0.8"/>
      <text x="22" y="26" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
      <text x="40" y="24" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF">Target NVMe &amp; Filesystem</text>
      <text x="40" y="44" class="font-sans" font-size="11" fill="#94A3B8">Disk: </text>
      <text x="73" y="44" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">/dev/nvme0n1</text>
      <text x="160" y="44" class="font-sans" font-size="11" fill="#94A3B8">(500GB SSD)</text>
      <text x="40" y="62" class="font-sans" font-size="11" fill="#94A3B8">Filesystem: </text>
      <text x="108" y="62" class="font-mono" font-size="11" font-weight="600" fill="#38BDF8">ext4</text>
      <text x="140" y="62" class="font-sans" font-size="11" fill="#94A3B8">(clean GRUB config) or ZFS</text>
    </g>

    <!-- Step 2.3 -->
    <g transform="translate(18, 233)">
      <rect width="309" height="100" rx="10" fill="#0C2556" stroke="#0284C7" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="22" cy="22" r="10" fill="#0284C7" fill-opacity="0.8"/>
      <text x="22" y="26" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
      <text x="40" y="24" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF">Static Cluster Network Identity</text>
      <text x="40" y="44" class="font-mono" font-size="11" fill="#BAE6FD">Node A: </text>
      <text x="95" y="44" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">192.168.1.51</text>
      <text x="185" y="44" class="font-sans" font-size="11" fill="#94A3B8">(pve-01.lan)</text>
      <text x="40" y="62" class="font-mono" font-size="11" fill="#BAE6FD">Node B: </text>
      <text x="95" y="62" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">192.168.1.52</text>
      <text x="185" y="62" class="font-sans" font-size="11" fill="#94A3B8">(pve-02.lan)</text>
      <text x="40" y="80" class="font-mono" font-size="10.5" fill="#64748B">Gateway: 192.168.1.1  •  DNS: 1.1.1.1</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(780, 275)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowSky)"/>
    <text x="13" y="-8" text-anchor="middle" class="font-mono" font-size="9" font-weight="600" fill="#BAE6FD">Boot PVE</text>
  </g>

  <!-- ================= STAGE 3: STABILITY FLAGS ================= -->
  <g transform="translate(815, 105)">
    <!-- Outer Card -->
    <rect width="345" height="348" rx="16" fill="url(#stage3Grad)" stroke="#F43F5E" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Stage Badge -->
    <rect x="20" y="18" width="68" height="22" rx="11" fill="#BE123C" fill-opacity="0.6"/>
    <text x="54" y="33" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FECDD3">STAGE 3</text>
    <text x="98" y="34" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">Mandatory Stability Flags</text>

    <!-- Step 3.1 -->
    <g transform="translate(18, 55)">
      <rect width="309" height="110" rx="10" fill="#2E1129" stroke="#F43F5E" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="22" cy="22" r="10" fill="#E11D48" fill-opacity="0.8"/>
      <text x="22" y="26" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
      <text x="40" y="23" class="font-sans" font-size="12.5" font-weight="700" fill="#FDA4AF">Kernel Parameters (/etc/default/grub)</text>

      <rect x="35" y="34" width="265" height="46" rx="6" fill="#14061A"/>
      <text x="42" y="49" class="font-mono" font-size="9.5" fill="#F43F5E">intel_idle.max_cstate=1 processor.max_cstate=1</text>
      <text x="42" y="63" class="font-mono" font-size="9.5" fill="#F43F5E">nvme_core.default_ps_max_latency_us=0</text>
      <text x="42" y="75" class="font-mono" font-size="9.5" fill="#38BDF8">nomodeset</text>

      <text x="40" y="96" class="font-mono" font-size="11" font-weight="600" fill="#A5B4FC">sudo update-grub</text>
      <text x="175" y="96" class="font-sans" font-size="11" fill="#94A3B8">(Apply &amp; reboot)</text>
    </g>

    <!-- Step 3.2 -->
    <g transform="translate(18, 173)">
      <rect width="309" height="74" rx="10" fill="#2E1129" stroke="#F43F5E" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="22" cy="22" r="10" fill="#E11D48" fill-opacity="0.8"/>
      <text x="22" y="26" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
      <text x="40" y="23" class="font-sans" font-size="12.5" font-weight="700" fill="#FFFFFF">Hardware Stability Reasons</text>
      <text x="40" y="42" class="font-sans" font-size="11" fill="#FECDD3">• C-states: stops mobile CPU idle freeze</text>
      <text x="40" y="56" class="font-sans" font-size="11" fill="#FECDD3">• APST: stops NVMe controller sleep drop</text>
      <text x="40" y="69" class="font-sans" font-size="11" fill="#FECDD3">• nomodeset: fixes headless iGPU panic</text>
    </g>

    <!-- Step 3.3 -->
    <g transform="translate(18, 255)">
      <rect width="309" height="78" rx="10" fill="#2E1129" stroke="#F43F5E" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="22" cy="22" r="10" fill="#E11D48" fill-opacity="0.8"/>
      <text x="22" y="26" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
      <text x="40" y="23" class="font-sans" font-size="12.5" font-weight="700" fill="#FFFFFF">Community Repository (Trixie)</text>
      <rect x="35" y="33" width="265" height="20" rx="5" fill="#14061A"/>
      <text x="40" y="47" class="font-mono" font-size="9" fill="#38BDF8">deb .../pve trixie pve-no-subscription</text>
      <text x="40" y="68" class="font-sans" font-size="11" fill="#94A3B8">apt update &amp;&amp; apt dist-upgrade -y</text>
    </g>
  </g>

  <!-- ================= BOTTOM RESULT BANNER ================= -->
  <g transform="translate(40, 475)">
    <rect width="1120" height="65" rx="14" fill="url(#resultGrad)" stroke="#10B981" stroke-width="1.8"/>

    <!-- Status Badge -->
    <rect x="20" y="16" width="90" height="32" rx="16" fill="#047857"/>
    <text x="65" y="37" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#ECFDF5">ONLINE 24/7</text>

    <!-- Banner Content -->
    <text x="125" y="30" class="font-sans" font-size="14.5" font-weight="700" fill="#FFFFFF">ROCK-SOLID PROXMOX VE 9.2 HYPERVISOR NODES READY FOR AUTOMATION</text>
    <text x="125" y="49" class="font-mono" font-size="11.5" fill="#A7F3D0">Web Console: https://192.168.1.51:8006 (pve-01.lan) &amp; https://192.168.1.52:8006 (pve-02.lan)</text>

    <!-- Power Badge -->
    <rect x="990" y="18" width="110" height="28" rx="8" fill="#064E3B" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="1045" y="36" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#34D399">~7–11W IDLE</text>
  </g>
</svg>